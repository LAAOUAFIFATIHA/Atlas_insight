<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AtlasInsight{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('accueil') }}"><span class="brand-mark" aria-hidden="true"></span>AtlasInsight</a>
      <nav class="nav" aria-label="Navigation principale">
        <a href="{{ url_for('accueil') }}" {% if page == 'accueil' %}aria-current="page"{% endif %}>Tableau de bord</a>
        <a href="{{ url_for('page_avis') }}" {% if page == 'avis' %}aria-current="page"{% endif %}>Analyse des avis</a>
        <a href="{{ url_for('page_demande') }}" {% if page == 'demande' %}aria-current="page"{% endif %}>Demande touristique</a>
        <a href="{{ url_for('page_prix') }}" {% if page == 'prix' %}aria-current="page"{% endif %}>Tarification</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer>Données synthétiques à des fins de démonstration : ces résultats ne sont pas des statistiques officielles du tourisme marocain.</footer>
  <script src="{{ url_for('static', filename='js/chart.umd.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
